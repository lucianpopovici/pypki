# /etc/security/limits.d/pypki.conf
# ulimits for the pypki service user.
# memlock unlimited: allow CA key memory pages to be locked (no swap).
# core 0: no core dumps that might contain key material.

pypki soft nofile 65536
pypki hard nofile 131072
pypki soft nproc 8192
pypki hard nproc 16384
pypki soft memlock unlimited
pypki hard memlock unlimited
pypki soft core 0
pypki hard core 0
