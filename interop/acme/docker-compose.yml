version: "3.9"
# ACME interop base: PyPKI ACME server
# Each certbot/acme-sh/lego/caddy subdirectory runs its own docker compose
# that extends this base service.

services:
  pypki-acme:
    image: python:3.12-slim
    working_dir: /pypki
    volumes:
      - ../../:/pypki:ro
      - acme-data:/var/lib/pypki
    command: >
      bash -c "
        pip install cryptography pyasn1 pyasn1-modules --quiet 2>&1 | tail -2 &&
        mkdir -p /var/lib/pypki &&
        python3 pki_server.py
          --no-auth
          --data-dir /var/lib/pypki
          --port 8090
          --ca-key-type ec-p256
          --acme-enabled
          --acme-host http://pypki-acme:8090
      "
    ports:
      - "8090:8090"
    healthcheck:
      test: ["CMD", "python3", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8090/acme/directory', timeout=3)"]
      interval: 5s
      retries: 12

volumes:
  acme-data:
